name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog-check:
    name: Changelog checkpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk-go
          fetch-depth: 0
      - name: Read changelog tool revision
        id: tool
        working-directory: sdk-go
        run: echo "revision=$(cat internal/cmd/publisher/sdk-rust-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: temporalio/sdk-rust
          ref: ${{ steps.tool.outputs.revision }}
          path: sdk-rust
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk-go/go.mod
          cache-dependency-path: sdk-go/go.sum
      - name: Validate changelog fragments
        working-directory: sdk-go
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          SKIP_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        shell: bash
        run: go run ./internal/cmd/publisher gate -skip-changelog="$SKIP_CHANGELOG" "$BASE_COMMIT"
